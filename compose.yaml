## Web UI will be available on port 55234 once deployed ##

services:
  ntp-dashboard:
    build:
      context: .
      args:
        INSTALL_GPSD_CLIENTS: "false" # Set to true when local GPS monitoring is required.
    container_name: ntp-dashboard
    network_mode: "host" # Required for local Chrony access.
    environment:
      - LOG_LEVEL=INFO
      # Set both variables to enable HTTP Basic Authentication.
      # - DASHBOARD_AUTH_USER=admin
      # - DASHBOARD_AUTH_PASSWORD=change-me
      # Optional SSH known_hosts file for strict host-key verification.
      # - SSH_KNOWN_HOSTS=/app/data/known_hosts
      # Enable the built-in GPSD only when INSTALL_GPSD_CLIENTS=true and a
      # GPS device is mapped into this container.
      # - ENABLE_GPSD=true
      # - GPS_DEVICE=/dev/ttyACM0
      # - GPSD_SOCKET=/var/run/gpsd.sock
    volumes:
      - ./data:/app/data # Persists UI settings
      - /run/chrony:/run/chrony # Expected host chrony path; /var/run/chrony is typically a symlink to /run/chrony
    # Example for a USB GPS receiver:
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
    restart: unless-stopped
