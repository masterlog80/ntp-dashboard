## Web UI will be available on port 55234 once deployed ##

services:
  ntp-dashboard:
    build:
      context: .
      args:
        INSTALL_GPSD_CLIENTS: "true" # Required for local GPS monitoring.
    container_name: ntp-dashboard
    networks:
      - gpsd_bridge
    environment:
      - LOG_LEVEL=INFO
      # Set both variables to enable HTTP Basic Authentication.
      # - DASHBOARD_AUTH_USER=admin
      # - DASHBOARD_AUTH_PASSWORD=change-me
      # Optional SSH known_hosts file for strict host-key verification.
      # - SSH_KNOWN_HOSTS=/app/data/known_hosts
      # chronyd-gps is reachable through Docker's internal DNS on gpsd_bridge.
      - GPSD_HOST=chronyd-gps
      - GPSD_PORT=2947
    volumes:
      - ./data:/app/data # Persists UI settings
      - chrony-run:/run/chrony # Shared with chronyd-gps for local chronyc access
      # Optional: allows the dashboard to detect its exact Docker image reference.
      # Remove this if Docker socket access is not desired; the footer will show ntp-dashboard:unknown.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

networks:
  gpsd_bridge:
    external: true

volumes:
  chrony-run:
    external: true
