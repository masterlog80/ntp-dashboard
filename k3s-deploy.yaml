# NTP server + dashboard for K3s
#
# Mirrors the Docker Compose setup:
# - chronyd uses the VK-172 GPS receiver and serves NTP on UDP/123.
# - ntp-dashboard shares Chrony's /run/chrony socket.
# - hostNetwork exposes NTP on the node's real interfaces and the dashboard
#   on TCP/55234.
#
# IMPORTANT:
# Label the K3s node physically connected to the GPS receiver:
#   kubectl label node <node-name> ntp-gps=true
#
# The pod is pinned to that node because /dev/ttyACM0 is node-local.

apiVersion: v1
kind: Namespace
metadata:
  name: ntp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntp
  namespace: ntp
  labels:
    app.kubernetes.io/name: ntp
    app.kubernetes.io/component: ntp-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntp
        app.kubernetes.io/component: ntp-server
    spec:
      nodeSelector:
        ntp-gps: "true"

      # Equivalent to Docker Compose network_mode: host.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30

      containers:
        - name: ntp
          image: simonrupf/chronyd:latest-gps
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
                - SYS_TIME
          env:
            - name: GPS_DEVICE
              value: /dev/ttyACM0
            - name: GPS_BAUD
              value: "9600"
            - name: GPS_REFCLOCK_OFFSET
              value: "0.0"
            - name: GPS_PPS
              value: "false"
            - name: NTP_SERVERS
              value: "time.cloudflare.com,time.google.com,0.jp.pool.ntp.org,1.jp.pool.ntp.org"
            - name: ENABLE_SYSCLK
              value: "true"
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
            - name: gps-device
              mountPath: /dev/ttyACM0
          ports:
            - name: ntp
              containerPort: 123
              protocol: UDP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

        - name: ntp-dashboard
          image: zot.salvetti.info/ntp-dashboard:latest
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: INFO
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
            - name: dashboard-data
              mountPath: /app/data
          ports:
            - name: http
              containerPort: 55234
              protocol: TCP
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 55234
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 55234
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        # Equivalent of the Docker named volume "chrony-run".
        # Both containers are in the same pod and share the Chrony socket.
        - name: chrony-run
          emptyDir: {}

        # Equivalent of:
        # /mnt/DOCKER/volumes/ntp-dashboard/data:/app/data
        - name: dashboard-data
          hostPath:
            path: /mnt/DOCKER/volumes/ntp-dashboard/data
            type: DirectoryOrCreate

        # Equivalent of:
        # /dev/ttyACM0:/dev/ttyACM0
        - name: gps-device
          hostPath:
            path: /dev/ttyACM0
            type: CharDevice

# ─────────────────────────────────────────────────────────────────────────────
# NTP Dashboard — Kubernetes / k3s RBAC
#
# The dashboard can query its own Pod through the Kubernetes API to detect the
# image name, image tag/version and actual container start time for the UI
# footer. The Role grants only GET access to Pods in the namespace where the
# dashboard runs.
#
# The Deployment must use:
#   serviceAccountName: ntp-dashboard-sa
#
# Quick-apply:
#   kubectl apply -f k3s/rbac.yaml
#   kubectl rollout restart deployment/ntp-dashboard
#
# If the dashboard is deployed into a namespace other than "default", change
# EVERY occurrence of "namespace: default" below to match.
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ntp-dashboard-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ntp-dashboard-pod-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ntp-dashboard-pod-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ntp-dashboard-sa
    namespace: default
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ntp-dashboard-pod-reader
