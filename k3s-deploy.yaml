# NTP server + dashboard for K3s
#
# Mirrors the Docker Compose setup:
# - chronyd uses the VK-172 GPS receiver and serves NTP on UDP/123.
# - ntp-dashboard shares Chrony's /run/chrony socket.
# - hostNetwork exposes NTP on the node's real interfaces and the dashboard
#   on TCP/55234.
#
# IMPORTANT:
# Label the K3s node physically connected to the GPS receiver:
#   kubectl label node <node-name> ntp-gps=true
#
# The pod is pinned to that node because /dev/ttyACM0 is node-local.

apiVersion: v1
kind: Namespace
metadata:
  name: ntp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ntp-dashboard
  namespace: ntp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ntp-dashboard
  namespace: ntp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ntp-dashboard
  namespace: ntp
subjects:
  - kind: ServiceAccount
    name: ntp-dashboard
    namespace: ntp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ntp-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntp
  namespace: ntp
  labels:
    app.kubernetes.io/name: ntp
    app.kubernetes.io/component: ntp-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntp
        app.kubernetes.io/component: ntp-server
    spec:
      serviceAccountName: ntp-dashboard
      nodeSelector:
        ntp-gps: "true"
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      containers:
        - name: ntp
          image: simonrupf/chronyd:latest-gps
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
                - SYS_TIME
          env:
            - name: GPS_DEVICE
              value: /dev/ttyACM0
            - name: GPS_BAUD
              value: "9600"
            - name: GPS_REFCLOCK_OFFSET
              value: "0.0"
            - name: GPS_PPS
              value: "false"
            - name: NTP_SERVERS
              value: "time.cloudflare.com,time.google.com,0.jp.pool.ntp.org,1.jp.pool.ntp.org"
            - name: ENABLE_SYSCLK
              value: "true"
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
            - name: gps-device
              mountPath: /dev/ttyACM0
          ports:
            - name: ntp
              containerPort: 123
              protocol: UDP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

        - name: ntp-dashboard
          image: zot.salvetti.info/ntp-dashboard:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: LOG_LEVEL
              value: INFO
            # Set these in a Kubernetes Secret before enabling authentication.
            # - name: DASHBOARD_AUTH_USER
            #   valueFrom:
            #     secretKeyRef:
            #       name: ntp-dashboard-auth
            #       key: username
            # - name: DASHBOARD_AUTH_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: ntp-dashboard-auth
            #       key: password
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
            - name: dashboard-data
              mountPath: /app/data
            - name: k8s-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          ports:
            - name: http
              containerPort: 55234
              protocol: TCP
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 55234
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 55234
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: chrony-run
          emptyDir: {}
        - name: dashboard-data
          hostPath:
            path: /mnt/DOCKER/volumes/ntp-dashboard/data
            type: DirectoryOrCreate
        - name: gps-device
          hostPath:
            path: /dev/ttyACM0
            type: CharDevice

        # Mount the ServiceAccount token only into the dashboard container.
        # This keeps the chrony container from receiving Kubernetes credentials.
        - name: k8s-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
