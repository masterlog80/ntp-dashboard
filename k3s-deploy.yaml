# NTP server + dashboard for K3s
#
# This deployment mirrors the Docker Compose setup:
# - chronyd runs with the VK-172 GPS receiver and serves NTP on UDP/123.
# - ntp-dashboard runs beside chronyd and reads the shared Chrony runtime socket.
# - hostNetwork is intentional: it allows chronyd to serve NTP on the node's
#   real network interfaces and exposes the dashboard on TCP/55234.
#
# IMPORTANT:
# Label the K3s node physically connected to the GPS receiver:
#   kubectl label node <node-name> ntp-gps=true
#
# The pod is pinned to that node so /dev/ttyACM0 is always the expected GPS.

apiVersion: v1
kind: Namespace
metadata:
  name: ntp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntp
  namespace: ntp
  labels:
    app.kubernetes.io/name: ntp
    app.kubernetes.io/component: ntp-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntp
        app.kubernetes.io/component: ntp-server
    spec:
      # Both containers must be on the same node as the physical GPS receiver.
      nodeSelector:
        ntp-gps: "true"

      # hostNetwork reproduces the Docker Compose network behaviour.
      # chronyd therefore listens on the node's UDP/123.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      terminationGracePeriodSeconds: 30

      containers:
        - name: ntp
          image: simonrupf/chronyd:latest-gps
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
                - SYS_TIME
          env:
            - name: GPS_DEVICE
              value: /dev/ttyACM0
            - name: GPS_BAUD
              value: "9600"
            - name: GPS_REFCLOCK_OFFSET
              value: "0.0"
            - name: GPS_PPS
              value: "false"
            - name: NTP_SERVERS
              value: "time.cloudflare.com,time.google.com,0.jp.pool.ntp.org,1.jp.pool.ntp.org"
            - name: ENABLE_SYSCLK
              value: "true"
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeDevices: []
          ports:
            - name: ntp
              containerPort: 123
              protocol: UDP
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
                - SYS_TIME
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - chronyc tracking >/dev/null 2>&1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24

        - name: ntp-dashboard
          image: zot.salvetti.info/ntp-dashboard:latest
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: INFO
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
            - name: dashboard-data
              mountPath: /app/data
          ports:
            - name: http
              containerPort: 55234
              protocol: TCP
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 55234
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 55234
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        # Shared only between the two containers in this pod.
        # This is the K3s equivalent of the Docker named volume chrony-run.
        - name: chrony-run
          emptyDir: {}

        # Equivalent of:
        # /mnt/DOCKER/volumes/ntp-dashboard/data:/app/data
        #
        # This path must exist on the ntp-gps node.
        - name: dashboard-data
          hostPath:
            path: /mnt/DOCKER/volumes/ntp-dashboard/data
            type: DirectoryOrCreate
